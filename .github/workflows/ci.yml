name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Claude Code 2.1.215
        run: npm install --global @anthropic-ai/claude-code@2.1.215
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Prove packed artifact (authenticated model turns are advisory)
        run: npm run release:proof
