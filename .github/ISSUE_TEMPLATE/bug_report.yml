name: Bug report
description: Report reproducible incorrect behavior or a regression
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include secrets or private trace data.
  - type: input
    id: version
    attributes:
      label: Parallax version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and Claude Code version
      placeholder: Windows 11, Node 22.17.0, Claude Code 2.1.211
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Redact credentials, project secrets, and private trace content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials and private project data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
